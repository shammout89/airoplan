name: aeroplan
services:
  app:
    build:
      context: .
      target: runtime
    image: aeroplan:0.14.0
    restart: unless-stopped
    init: true
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      AEROPLAN_DATA_DIR: /var/lib/aeroplan
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:3000"
    volumes:
      - aeroplan_data:/var/lib/aeroplan
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  aeroplan_data:
